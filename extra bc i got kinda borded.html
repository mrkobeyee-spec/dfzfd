    <meta charset="UTF-8">
    <title>Flappy Bird Simple</title>
    <style>
        body { margin:0; background:#70c5ce; }
        canvas { display:block; margin:auto; background:#70c5ce; }
    </style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>

<canvas id="game" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let bird = { x: 60, y: 200, w: 30, h:30, velocity: 0 };
    let gravity = 0.4;
    let jump =-7;
    let pipes = [];
    let frame = 0;
    let score = 0;
    let gameOver = false;

function resetGame() {
    bird.y = 200;
    bird.velocity = 0;
    pipes = [];
    frame = 0;
    score = 0
    ganeOver = false
}

function createPipe() {
    let gap = 140;
    let topHeight = Math.random() * (canvas.height - gap - 50);
    pipes.push({
        x:canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        w: 60
    });
}

function drawBird() {
    ctx.fillStyle = "yellow";
    ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
}

function drawPipes() {
    ctx.fillStyle = "green";
    pipes.forEach(p => {
        ctx.fillRect(p.x, 0, p.w, p.top);
        ctx.fillRect(p.x, p.bottom, p.w, canvas.height - p.bottom);
    });
}

function updateBird() {
    bird.velocity += gravity;
    bird.y += bird.velocity;

    if (bird.y +bird.h > canvas.height || bird.y <0) {
    gameOver = true;
    }
}

function updatePipes () {
    pipes.forEach(p => {
        p.x -= 3;

//Collision
        if (
            bird.x < p.x + p.w &&
            bird.x + bird.w > p.x &&
            (bird.y < p.top || bird.y + bird.h > p.bottom)
        ) {
            gameOver = true;
        }

        //Score
        if (p.x + p.w === bird.x) score++;
    });

    // Remove off-screen pipes
    pipes = pipes.filter(p => p.x + p.w > 0);
}

function drawScore() {
    ctx.fillStyle = "white";
    ctx.font = "30px. Arial";
    ctx
    fillText(score, 20, 40);
}

}
