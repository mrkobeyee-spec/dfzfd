<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird (HTML Version)</title>
    <style>
        body { margin: 0; background: #87CEEB; }
        canvas { display: block; margin: auto; background: #87CEEB; }
    </style>
</head>
<body>

<canvas id="game" width="500" height="700"></canvas>

<script>
    // ====== Game Variables (Java-style fields) ======
    let birdX = 100;
    let birdY = 250;
    let birdVelocity = 0;
    const GRAVITY = 1;
    const JUMP = -12;

    let pipes = [];
    let score = 0;
    let gameOver = false;
    let started = false;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ====== Pipe Creation ======
    function addPipe() {
        const gap = 200;
        const width = 80;
        const height = 50 + Math.random() * 200;

        pipes.push({ x: 500, y: 0, width, height });
        pipes.push({ x: 500, y: height + gap, width, height: 700 - height - gap });
    }

    // Initial pipes
    addPipe();
    addPipe();

    // ====== Game Loop ======
    function update() {
        if (gameOver) {
            draw();
            return;
        }

        if (started) {
            birdVelocity += GRAVITY;
            birdY += birdVelocity;

            // Move pipes
            pipes.forEach(p => p.x -= 5);

            // Remove off-screen pipes
            pipes = pipes.filter(p => p.x + p.width > 0);

            // Add new pipes
            if (pipes.length < 4) addPipe();

            // Collision detection
            pipes.forEach(p => {
                if (birdX < p.x + p.width &&
                    birdX + 30 > p.x &&
                    birdY < p.y + p.height &&
                    birdY + 30 > p.y) {
                    gameOver = true;
                }
            });

            // Ground / ceiling
            if (birdY > 570 || birdY < 0) {
                gameOver = true;
            }

            // Score
            pipes.forEach(p => {
                if (p.y === 0 && p.x + p.width === birdX) {
                    score++;
                }
            });
        }

        draw();
        requestAnimationFrame(update);
    }

    // ====== Drawing (like paintComponent) ======
    function draw() {
        // Background
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, 500, 700);

        // Ground
        ctx.fillStyle = "orange";
        ctx.fillRect(0, 600, 500, 100);

        // Bird
        ctx.fillStyle = "red";
        ctx.fillRect(birdX, birdY, 30, 30);

        // Pipes
        ctx.fillStyle = "green";
        pipes.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
        });

        // Score
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText(score, 230, 80);

        if (!started) {
            ctx.fillText("Press SPACE", 120, 300);
        }

        if (gameOver) {
            ctx.fillText("Game Over", 130, 350);
        }
    }

    // ====== Controls ======
    document.addEventListener("keydown", e => {
        if (e.code === "Space") {
            if (gameOver) {
                // Reset
                birdY = 250;
                birdVelocity = 0;
                pipes = [];
                addPipe();
                addPipe();
                score = 0;
                gameOver = false;
            }
            started = true;
            birdVelocity = JUMP;
        }
    });

    // Start game
    update();
</script>

</body>
</html>
